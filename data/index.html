<!DOCTYPE html>
<html>
<head>
  <title>ESP32 LED Control</title>
  <script>
    let ws;
    window.onload = () => {
      ws = new WebSocket(`ws://${location.host}/ws`);
      ws.onmessage = (msg) => {
        document.getElementById('state').textContent = "LED is " + msg.data;
      };
    };
    function toggleLED(state) {
      ws.send(state);
    }
  </script>
</head>
<body>
  <h1>ESP32 WebSocket LED Control</h1>
  <button onclick="toggleLED('ON')">Turn ON</button>
  <button onclick="toggleLED('OFF')">Turn OFF</button>
  <p id="state">LED is OFF</p>
</body>
</html>
